# JupyterHub on a single Docker host. Settings live in .env (see .env.example).
#
# Services reach each other through aliases ending in .internal, a domain
# reserved for private use. A plain service name can resolve to an outside host
# through a DNS search domain while its container is down; these names can't.
name: jupyterhub

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  traefik:
    <<: *defaults
    image: traefik:v3.7.16
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.middlewares=security-headers@file
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    environment:
      # Used by the routes in traefik/dynamic.yml.
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge
      - monitoring

  # Routes requests to the hub and to users' servers. It runs apart from the
  # hub, so users stay connected while the hub restarts.
  proxy:
    <<: *defaults
    image: jupyterhub/configurable-http-proxy:5.3.0
    command:
      - --default-target=http://hub.internal:8081
      - --error-target=http://hub.internal:8081/hub/error
      # Traefik already sets the X-Forwarded headers.
      - --no-x-forward
    environment:
      CONFIGPROXY_AUTH_TOKEN: ${PROXY_AUTH_TOKEN:?Set PROXY_AUTH_TOKEN in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/_chp_healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    networks:
      edge:
        aliases: [proxy.internal]
      users:
        aliases: [proxy.internal]

  jupyterhub:
    <<: *defaults
    image: ghcr.io/irfan-farmer/dockerized-jupyterhub:2.0.0
    # Used when the image isn't published yet, or with --build.
    build: ./jupyterhub
    environment:
      - DOMAIN
      - PROXY_AUTH_TOKEN
      - OAUTH_CLIENT_ID
      - OAUTH_CLIENT_SECRET
      - OAUTH_AUTHORIZE_URL
      - OAUTH_TOKEN_URL
      - OAUTH_USERDATA_URL
      - OAUTH_USERNAME_CLAIM
      - OAUTH_SCOPE
      - OAUTH_LOGIN_SERVICE
      - OAUTH_GROUPS_CLAIM
      - ADMIN_USERS
      - ADMIN_GROUPS
      - ALLOWED_USERS
      - ALLOWED_GROUPS
      - ALLOW_ALL_USERS
      - NOTEBOOK_IMAGE
      - USER_MEM_LIMIT
      - USER_CPU_LIMIT
      - IDLE_TIMEOUT
      - SHARED_DATA_DIR
    volumes:
      # Required by DockerSpawner to start user containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jupyterhub:/srv/jupyterhub/config:ro
      - hub_data:/srv/jupyterhub/data
    secrets:
      - metrics_token
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/hub/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
      users:
        aliases: [hub.internal]
      monitoring:

  maintenance:
    <<: *defaults
    image: nginxinc/nginx-unprivileged:1.31.7-alpine
    volumes:
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
      - ./maintenance/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      edge:
        aliases: [maintenance.internal]

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    networks:
      monitoring:
        aliases: [prometheus.internal]

  node-exporter:
    <<: *defaults
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - monitoring

  grafana:
    <<: *defaults
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY in .env}
    # Only reachable from the host itself. Open it through an SSH tunnel
    # (see docs/operations.md#monitoring).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      # default: publishes the local port and lets alerts reach mail or chat.
      - default
      - monitoring

secrets:
  # Lets Prometheus read the hub's /hub/metrics endpoint.
  metrics_token:
    environment: METRICS_TOKEN

networks:
  # Traefik, the proxy and the maintenance page.
  edge:
  # The hub, the proxy and user containers. Name referenced in jupyterhub_config.py.
  users:
    name: jupyterhub-users
  # Metrics only; no internet access.
  monitoring:
    internal: true

volumes:
  hub_data:
  letsencrypt:
  prometheus_data:
  grafana_data:
