global:
  scrape_interval: 30s

scrape_configs:
  - job_name: jupyterhub
    metrics_path: /hub/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["hub.invalid:8081"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik.invalid:8082"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter.invalid:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
