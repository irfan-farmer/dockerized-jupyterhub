global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds

scrape_configs:
  # JupyterHub metrics
  - job_name: 'jupyterhub'
    metrics_path: '/hub/metrics'  # JupyterHub metrics endpoint
    static_configs:
      - targets: ['jupyterhub:80']  # Use the service name defined in docker-compose.yml
    authorization:
      credentials: '${API_TOKEN}'  # Use the API_TOKEN environment variable

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['reverse-proxy:8080']  # Use the service name defined in docker-compose.yml
    metrics_path: '/metrics'  # Traefik metrics endpoint

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']  # Prometheus self-metrics

  # Node Exporter (optional, for system metrics)
  # Uncomment this section if you add Node Exporter to your docker-compose.yml
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['node_exporter:9100']  # Node Exporter metrics endpoint
