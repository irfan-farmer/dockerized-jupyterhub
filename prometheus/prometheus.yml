global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'jupyterhub'
    static_configs:
      - targets: ['jupyterhub:9100']  # Access via Docker network
    tls_config:
      insecure_skip_verify: true

  - job_name: 'traefik'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['reverse-proxy:8080']  # Traefik metrics endpoint

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']


  # Node Exporter (optional, for system metrics)
  # Uncomment this section if you add Node Exporter to your docker-compose.yml
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['node_exporter:9100']  # Node Exporter metrics endpoint
