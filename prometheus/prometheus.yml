global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds

scrape_configs:
  # JupyterHub metrics
  - job_name: 'jupyterhub'
    metrics_path: '/hub/metrics'  # JupyterHub metrics path
    static_configs:
      - targets: ['jupyterhub:80']  # Use the service name (ensure DNS resolution works)
    authorization:
      credentials: 'd98fc5bc342d484e9aa5ff7951151e67'  # API token for authentication

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']  # Traefik metrics endpoint
    metrics_path: '/metrics'  # Traefik metrics path

  # Docker metrics (if using Docker)
  - job_name: 'docker'
    static_configs:
      - targets: ['docker:9323']  # Docker metrics endpoint (ensure Docker is configured to expose metrics)
    metrics_path: '/metrics'  # Docker metrics path

  # Node exporter (system metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']  # Node exporter metrics endpoint
    metrics_path: '/metrics'  # Node exporter metrics path

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']  # Prometheus self-metrics
