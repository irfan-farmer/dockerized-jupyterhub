name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: jupyterhub/Dockerfile

      - name: Smoke test
        run: tests/smoke-test.sh

      - name: Find the hub image
        id: hub-image
        run: echo "ref=$(docker compose --env-file tests/test.env config --images | grep dockerized-jupyterhub)" >> "$GITHUB_OUTPUT"

      - name: Scan the hub image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.hub-image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  repo2docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test servers from a repo2docker environment
        run: tests/repo2docker-test.sh
