[security]
admin_user = admin
admin_password = graph*  # Change to a stronger password

[server]
http_port = 3000
domain = mvre.diva.cloud.awi.de  # Replace with your domain
root_url = %(protocol)s://%(domain)s:%(http_port)s/
http_addr = 0.0.0.0  # Allow remote access

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[analytics]
reporting_enabled = false  # Disable anonymous usage reporting

[log]
mode = console
level = info

[auth.anonymous]
enabled = true  # Allow anonymous access (optional, for public dashboards)
org_role = Viewer  # Set role for anonymous users
