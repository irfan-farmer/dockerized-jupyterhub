# Grafana settings for this deployment. Secrets and the public URL are set
# through environment variables in compose.yaml.

[security]
cookie_secure = true
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

# No calls to grafana.com or other third parties.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false
