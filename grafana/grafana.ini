# Grafana settings for this deployment. Secrets are set through environment
# variables in compose.yaml. Grafana listens on the host's localhost only and
# is opened through an SSH tunnel, so it serves plain HTTP.

[security]
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

# No calls to grafana.com or other third parties.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

# No plugin downloads, updates or signing-key checks from grafana.com. The
# provisioned dashboard only uses plugins built into Grafana.
[plugins]
preinstall_disabled = true
preinstall_auto_update = false
public_key_retrieval_disabled = true
plugin_admin_enabled = false
