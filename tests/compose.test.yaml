# Test-only additions to compose.yaml, used by the scripts in tests/.
#
# Containers that could reach the internet look up outside names through a
# canary resolver instead of real DNS. It answers every name with an unroutable
# address, so tests never contact a real server, and it logs each lookup, so the
# tests fail if anything looks up a name outside Docker. User containers reach
# it on the users network (see tests/hub_test_config.py). Prometheus and Node
# exporter need no canary: their network has no outside DNS at all.
x-canary: &canary
  dns: [198.51.100.53]
  networks:
    canary: {}

services:
  canary-dns:
    image: coredns/coredns:1.15.0
    command: ["-conf", "/Corefile"]
    volumes:
      - ./tests/canary.Corefile:/Corefile:ro
    networks:
      canary:
        ipv4_address: 198.51.100.53
      users:
        ipv4_address: 198.18.0.53

  traefik: *canary
  proxy: *canary
  maintenance: *canary
  grafana: *canary
  jupyterhub:
    <<: *canary
    command: ["jupyterhub", "-f", "/srv/jupyterhub/tests/hub_test_config.py"]
    volumes:
      - ./tests/hub_test_config.py:/srv/jupyterhub/tests/hub_test_config.py:ro

# Both subnets are reserved for documentation and testing, so they can't clash
# with a real network.
networks:
  canary:
    ipam:
      config:
        - subnet: 198.51.100.0/24
  users:
    ipam:
      config:
        - subnet: 198.18.0.0/24
