<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Back shortly</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #1a73e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417;
        --card: #1c1f24;
        --text: #e4e7eb;
        --muted: #9aa5b1;
        --accent: #8ab4f8;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 32rem;
      padding: 2.5rem;
      border-radius: 1rem;
      background: var(--card);
      box-shadow: 0 10px 30px rgb(0 0 0 / 0.08);
      text-align: center;
    }
    svg {
      width: 5rem;
      height: 5rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
    h1 { margin-bottom: 1rem; font-size: 1.75rem; }
    p { color: var(--muted); line-height: 1.6; }
    p + p { margin-top: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true">
      <circle cx="50" cy="50" r="38" stroke-width="12" stroke-dasharray="10 9.9"/>
      <circle cx="50" cy="50" r="28" stroke-width="10"/>
    </svg>
    <h1>Back shortly</h1>
    <p>JupyterHub is restarting or under maintenance. Saved work is not affected.</p>
    <p>This page reloads every 30 seconds.</p>
  </main>
</body>
</html>
