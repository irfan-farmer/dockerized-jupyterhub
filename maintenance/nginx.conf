# Answers every request with the maintenance page and HTTP 503, so browsers
# and crawlers treat the outage as temporary.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;

    error_page 503 /index.html;

    location = /index.html {
        internal;
    }

    location / {
        return 503;
    }
}
