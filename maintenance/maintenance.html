<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 1.5rem;
        }

        .refresh-note {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
            border-left: 4px solid #1a73e8;
            text-align: left;
            margin-top: 2rem;
        }

        .animation-container {
            margin: 2rem 0;
            height: 200px;
        }

        /* Animation keyframes */
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wave-animation {
            animation: wave 3s ease-in-out infinite;
        }

        .gear-animation {
            animation: rotate 8s linear infinite;
            transform-origin: center;
            transform-box: fill-box;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <h1>Under Maintenance</h1>
        <p>We're currently upgrading our systems to improve your experience.<br>
           This should only take a few minutes.</p>
        
        <div class="animation-container">
            <svg viewBox="0 0 200 200" width="200" height="200">
                <!-- Base circle -->
                <circle cx="100" cy="100" r="90" fill="#f0f4f8" />
                
                <!-- Animated gears -->
                <g class="gear-animation">
                    <path fill="#1a73e8" d="M100,50 L108,65 L123,65 L115,80 L123,95 L108,95 L100,110 L92,95 L77,95 L85,80 L77,65 L92,65 Z" />
                </g>
                <g class="gear-animation" style="animation-direction: reverse;">
                    <path fill="#4285f4" d="M140,90 L148,105 L163,105 L155,120 L163,135 L148,135 L140,150 L132,135 L117,135 L125,120 L117,105 L132,105 Z" />
                </g>
                
                <!-- Waves representing water -->
                <path class="wave-animation" fill="#e8f0fe" d="M30,140 Q50,120 70,140 Q90,160 110,140 Q130,120 150,140 Q170,160 190,140 L190,200 L30,200 Z" />
            </svg>
        </div>

        <div class="refresh-note">
            <p style="margin-bottom: 0;">💡 <strong>Quick tip:</strong> If the service doesn't automatically load when we're back, try refreshing your browser page.</p>
        </div>
    </div>
</body>
</html>
