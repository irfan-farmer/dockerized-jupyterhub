defaultEntryPoints = ["https", "http"]

[entryPoints]
  [entryPoints.http]
    address = ":80"
    [entryPoints.http.redirect]
      entryPoint = "https"
  
  [entryPoints.https]
    address = ":443"
    [entryPoints.https.tls]
      [[entryPoints.https.tls.certificates]]
        certFile = "/etc/certs/diva.crt"
        keyFile = "/etc/certs/diva.key"

[docker]
  endpoint = "unix:///var/run/docker.sock"
  domain = "mvre.diva.cloud.awi.de"
  watch = true
  exposedByDefault = false

[web]
  address = ":8080"
  [web.metrics.prometheus]

[web.auth.basic]
users = ["admin:$apr1$3Ww7mRW3$kR.TjJ.nholDKV2CSf6Qe1"]  # Match .env value

