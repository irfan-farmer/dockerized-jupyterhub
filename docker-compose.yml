version: '3'

services:
  jupyterhub:
    build: ./jupyterhub  # Points to the jupyterhub directory where the Dockerfile is located
    image: jupyterhub_img  # Name for the custom JupyterHub image
    container_name: jupyterhub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for spawning containers
    environment:
      - DOCKER_NETWORK_NAME=${COMPOSE_PROJECT_NAME}_default  # Docker network configuration
      - HUB_IP=jupyterhub
      - HOST=${HOST}  # Hostname for Traefik routing
      - CLIENT_ID=${CLIENT_ID}  # OAuth client ID
      - CLIENT_SECRET=${CLIENT_SECRET}  # OAuth client secret
      - API_TOKEN=${API_TOKEN}  # API token for Prometheus service
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:${HOST}"
    restart: on-failure

  reverse-proxy:
    image: traefik:v1.7
    container_name: traefik
    command: --docker  # Enables the web UI and tells Traefik to listen to Docker
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Expose Traefik metrics endpoint
    volumes:
      - ./reverse-proxy/traefik.toml:/etc/traefik/traefik.toml
      - /etc/certs:/etc/certs  # SSL certificates
      - /var/run/docker.sock:/var/run/docker.sock  # Traefik listens to Docker events
    restart: on-failure

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Expose Grafana on port 3000
    environment:
      - GF_LOG_LEVEL=debug
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini  # Path inside container
    volumes:
      - grafana_data:/var/lib/grafana  # Persist Grafana data
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini  # Map grafana.ini from host to container
    restart: always

volumes:
  grafana_data: {}
