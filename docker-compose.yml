version: '3'
services:
  jupyterhub:
    build: ./jupyterhub
    image: jupyterhub_img
    container_name: jupyterhub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_NETWORK_NAME=${COMPOSE_PROJECT_NAME}_default
      - HUB_IP=jupyterhub
      - HOST=${HOST}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - API_TOKEN=${API_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.backend=jupyterhub"
      - "traefik.frontend.rule=Host:${HOST}"
      - "traefik.port=8000"
      - "traefik.frontend.passHostHeader=true"
      - "traefik.backend.healthcheck.path=/"
      - "traefik.backend.healthcheck.interval=5s"
    restart: on-failure

  reverse-proxy:
    image: traefik:v1.7
    container_name: traefik
    command: --docker
    environment:
      - DOCKER_API_VERSION=1.24
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./reverse-proxy/traefik.toml:/etc/traefik/traefik.toml
      - /etc/certs:/etc/certs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: on-failure

  maintenance:
    image: nginx:alpine
    container_name: maintenance
    volumes:
      - ./maintenance:/usr/share/nginx/html:ro
      - ./maintenance-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.backend=maintenance"
      - "traefik.frontend.rule=Host:${HOST}"
      - "traefik.port=80"
      - "traefik.frontend.priority=1"
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    networks:
      - monitoring
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.backend=prometheus"
      - "traefik.frontend.rule=Host:prometheus.${HOST}"
      - "traefik.port=9090"
      - "traefik.frontend.auth.basic.users=${PROMETHEUS_AUTH}"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_LOG_LEVEL=debug
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
    restart: always

volumes:
  grafana_data: {}
