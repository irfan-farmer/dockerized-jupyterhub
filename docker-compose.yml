version: '3'

services:
  jupyterhub:
    build: ./jupyterhub # This points to the jupyterhub directory where your Dockerfile is located
    image: jupyterhub_img # This is the name you want for your custom JupyterHub image
    container_name: jupyterhub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket for spawning containers
    environment:
      - DOCKER_NETWORK_NAME=${COMPOSE_PROJECT_NAME}_default # Docker network configuration
      - HUB_IP=jupyterhub
      - HOST
    labels:
      - "traefik.enable=true"
      - "traefik.frontend.rule=Host:${HOST}"
    restart: on-failure
  
 
          
  reverse-proxy:
    image: traefik:v1.7
    container_name: traefik
    command: --api --docker # Enables the web UI and tells Traefik to listen to docker, Enabling the Web UI with the --api flag might expose configuration elements
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # This exposes the Traefik dashboard port
    volumes:
      - /jupyterhub-docker/reverse-proxy/traefik.toml:/etc/traefik/traefik.toml
      - /etc/certs:/etc/certs
      - /var/run/docker.sock:/var/run/docker.sock # So that Traefik can listen to the Docker events
    restart: on-failure


  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - /jupyterhub-docker/prometheus:/etc/prometheus
    ports:
      - '9090:9090'
    restart: always    

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"  # Expose Grafana on port 3000
    environment:
      - GF_LOG_LEVEL=debug
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini  # Path inside container
    volumes:
      - grafana_data:/var/lib/grafana  # To persist Grafana data
      - /jupyterhub-docker/grafana/grafana.ini:/etc/grafana/grafana.ini # Map grafana.ini from host to the grafana container
    restart: always

volumes:
  grafana_data: {}



